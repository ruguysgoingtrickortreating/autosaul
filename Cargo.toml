[package]
name = "autosaul"
version = "0.1.0"
edition = "2024"
default-run = "autosaul"

[dependencies]
colored = "3.0.0"
lavalink-rs = { version = "0.15.0", features = [
  "serenity",
  "songbird",
  "macros",
] }
poise = { version = "0.6.1", features = ["cache"] }
rand = "0.9.2"
serde_json = "1"
reqwest = { version = "0.12.28", features = [
  "blocking",
  "rustls-tls",
], default-features = false }
songbird = { version = "0.5.0", features = ["builtin-queue"] }
symphonia = { version = "0.5", features = ["aac", "mp3", "isomp4", "alac"] }
tokio = { version = "1.45.1", features = ["rt-multi-thread"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
itertools = "0.14.0"
phf = "0.13.1"
project-root = "0.2.2"
phf_codegen = "0.13.1"
saulimages = { git = "https://github.com/ruguysgoingtrickortreating/saulimages" }

[build-dependencies]
phf = { version = "0.13.1", default-features = false }
phf_codegen = "0.13.1"
project-root = "0.2.2"
